# WOTR - "Walk On The Road"
#
# The most valuable source in the project so far, for one reason: the camera is
# at pedestrian height on a footpath, not behind a car windscreen. Driving
# datasets see a rickshaw from four metres up and twenty metres away; this sees
# what a person walking into it sees.
#
# Source:   https://github.com/kxzr/WOTR
# Licence:  MIT - no conditions beyond attribution, fully compatible with AGPL-3.0
# Format:   Pascal VOC (Annotations/*.xml + JPEGImages/*.jpg)
# Region:   Chinese urban streets. Right viewpoint, wrong country - the
#           geographic half of the domain gap is addressed separately, via
#           Mapillary plus auto-labelling. See docs/04-datasets.md.
#
# Verified on the lab server, not quoted from the paper:
#   13,928 images  ·  189,994 objects  ·  13.6 objects per image
#   resolutions: 876x657 (4,633), 1020x1360 (1,255), 640x480 (981), mixed
#
# Note the portrait resolution in second place. Handheld phone footage is
# often portrait, and a letterbox at 320x320 wastes most of a portrait frame.
# Worth measuring whether a portrait-aware input crop beats square letterboxing
# before assuming the standard recipe is right for this product.

sources:
  wotr:
    root: data/raw/wotr/WOTR
    format: voc
    url: https://github.com/kxzr/WOTR
    licence: MIT
    images: 13928
    attribution: "WOTR dataset, https://github.com/kxzr/WOTR, MIT licence"

# WOTR class -> Sarathi taxonomy class.
#
# `null` means the class is deliberately dropped. Mapping honestly beats
# inventing a class from too few examples, and dropping honestly beats
# forcing a bad match.
    label_map:
      person:          person            # 35,245
      pole:            pole              # 31,144
      car:             car               # 27,583
      tree:            tree              # 22,515
      motorcycle:      motorcycle        # 12,162
      warning_column:  warning_column    # 10,431
      crosswalk:       crosswalk         #  8,558
      bicycle:         bicycle           #  5,995
      green_light:     traffic_light_green  # 4,965
      red_light:       traffic_light_red    # 4,961
      roadblock:       barrier           #  4,402
      reflective_cone: traffic_cone      #  4,125
      truck:           truck             #  3,537
      sign:            sign_board        #  3,360
      ashcan:          bin               #  2,857
      blind_road:      tactile_paving    #  2,381 - WOTR's name for tactile paving
      bus:             bus               #  1,787
      tricycle:        cycle_rickshaw    #  1,580 - see note below
      fire_hydrant:    fire_hydrant      #  1,384
      dog:             dog               #  1,022

notes:
  tricycle: >
    WOTR's `tricycle` is the Chinese three-wheeled cargo/passenger vehicle. It
    is not an auto-rickshaw, but it is structurally and behaviourally close to
    a cycle-rickshaw at pedestrian range: similar height, similar footprint,
    similar way of blocking a footpath. Mapping it to cycle_rickshaw is a
    deliberate approximation, recorded here so the evaluation can check whether
    it actually transfers rather than assuming it does.

  motorcycle: >
    WOTR does not distinguish moving from parked. Sarathi treats
    parked_scooter as a separate class because a parked scooter is footpath
    clutter while a moving motorcycle is traffic - different hazard, different
    phrasing. Everything here lands in `motorcycle`; separating them needs a
    source that labels the distinction, or a heuristic from the tracker.

  sign: >
    Maps to sign_board, not sign_post. WOTR labels the board; sign_post - the
    thin pole holding a board at head height - is the actual hazard and is not
    separately labelled here.

# Classes in the Sarathi taxonomy that WOTR does NOT supply. Listed so the
# coverage picture stays honest rather than looking complete because one large
# dataset landed.
absent:
  - stairs_up
  - stairs_down
  - step_up
  - step_down
  - kerb
  - open_manhole
  - pothole
  - auto_rickshaw
  - cow
  - all indoor and furniture classes
