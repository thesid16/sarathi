# Sarathi taxonomy - the single source of truth for what the detector knows.
#
# Built the honest way round: from what public datasets can actually supply,
# not from a wish list. Every class records which datasets cover it and how
# well, so the holes are visible before training rather than discovered in the
# results.
#
# coverage:
#   good     - a labelled dataset covers this class at a useful viewpoint
#   partial  - covered, but from the wrong viewpoint (driving datasets) or in
#              small numbers; needs augmentation or auto-labelling
#   gap      - no confirmed source yet. These are named, not hidden, and each
#              gets a measured recall in the evaluation report.
#   pending  - a source exists but its licence or access is unresolved
#
# hazard: drives saliency ranking, not just phrasing. See sarathi/types.py.
#   critical - can injure: drop-offs, moving vehicles, head-height obstacles
#   high     - will be walked into
#   medium   - matters for orientation
#   low      - context only; spoken on request, never unprompted
#
# hi: spoken Hindi label. DRAFT - needs review by a native speaker before it
# ships. Entries marked `hi_review: true` are ones I am least confident about,
# usually because the concept has no settled everyday Hindi term.

version: 0.1.0
name: sarathi77

sources:
  wotr:        {licence: MIT,          viewpoint: pedestrian, status: downloaded}
  ss4blind:    {licence: unstated,     viewpoint: wearable,   status: downloaded}
  coco:        {licence: CC-BY-4.0,    viewpoint: mixed,      status: planned}
  openimages:  {licence: CC-BY-4.0,    viewpoint: mixed,      status: planned}
  lvis:        {licence: CC-BY-4.0,    viewpoint: mixed,      status: planned}
  openmanhole: {licence: CC-BY-4.0,    viewpoint: road,       status: planned}
  rdd2022:     {licence: CC-BY-SA-4.0, viewpoint: road,       status: planned}
  stairnet:    {licence: unresolved,   viewpoint: chest-cam,  status: blocked-on-ieee-login}
  idd:         {licence: unresolved,   viewpoint: driving,    status: blocked-on-login}
  mapillary:   {licence: CC-BY-SA-4.0, viewpoint: street,     status: auto-label-pipeline}

