[project]
name = "sarathi-prototype"
version = "0.1.0"
description = "Desktop prototype of the Sarathi assistive navigation pipeline. Validates perception, guidance and power policy before the Android port."
requires-python = ">=3.10"

# Kept deliberately small. Anything heavy (torch, VLM runtimes) is an optional
# extra so the core pipeline stays installable and fast to set up on any machine.
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "onnxruntime>=1.17",
    # The desktop app renders frames through Pillow. It is imported lazily
    # inside the draw loop, so leaving it undeclared does not fail at import -
    # the window opens, and then dies on the first frame. A missing dependency
    # that surfaces only when the feature is used is worse than one that fails
    # at startup.
    "pillow>=10.0",
]

[project.optional-dependencies]
# Monocular depth and any torch-based model candidates.
depth = ["torch>=2.2", "torchvision>=0.17"]
# On-demand OCR path.
ocr = ["rapidocr-onnxruntime>=1.3"]
# Speech output on non-macOS hosts (macOS uses the built-in `say` binary).
tts = ["pyttsx3>=2.90"]
# Scene description with Gemma 4. Pinned to the same version the Android app
# uses, so a description read on a laptop is the description the phone gives.
vlm = ["litert-lm==0.15.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "onnx>=1.16"]

[project.scripts]
sarathi = "sarathi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sarathi*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
