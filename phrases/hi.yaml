system:
  starting: "सारथी तैयार"
  stopping: "बंद हो रहा है"
  camera_lost: "कैमरा बंद"
  camera_back: "कैमरा वापस"
  nothing_ahead: "सामने कुछ नहीं"
  reading: "पढ़ रहा हूँ"
  no_text: "कोई लेख नहीं मिला"
  describing: "देख रहा हूँ"
  describing_first_run: "मॉडल लोड हो रहा है, एक क्षण"
  no_description: "बता नहीं सकता"
  vlm_missing: "दृश्य वर्णन इंस्टॉल नहीं है"
  # मॉडल को भेजा जाता है, बोला नहीं जाता। उत्तर उसी भाषा में आता है जिसमें
  # पूछा जाए, इसलिए हिंदी वर्णन इसी पंक्ति से मिलता है।
  describe_prompt: "मेरे सामने अभी क्या है? हिंदी में उत्तर दीजिए।"
  # मॉडल को दिया जाने वाला निर्देश। भाषा यहीं तय होती है - केवल प्रश्न हिंदी में
  # पूछने से उत्तर अंग्रेज़ी में ही आता रहा, क्योंकि निर्देश अंग्रेज़ी में था।
  describe_system: >
    आप एक दृष्टिबाधित व्यक्ति के लिए दृश्य का वर्णन करते हैं जो वहीं खड़ा है जहाँ
    कैमरा है। केवल हिंदी में उत्तर दें। एक छोटे वाक्य में, तीस शब्दों से कम।
    सबसे पहले वह बताएं जो सीधे सामने और सबसे पास है। सरल नाम लें। दिशा बाएँ,
    सामने या दाएँ में बताएं। चित्र, फ़ोटो या कैमरे का उल्लेख न करें। जो दिख नहीं
    रहा उसका अनुमान न लगाएं। यदि दृश्य बहुत अंधेरा या धुंधला है तो वही कहें।

# Terms with no settled everyday Hindi equivalent, where I have coined or
# borrowed something. A native speaker should confirm these before release.
review_needed:
  - tactile_paving   # "स्पर्श पट्टी" is a coinage
  - warning_column   # shares "खंभा" with pole - may need distinguishing
  - overhead_wire
  - pedestrian_signal
  - bearing_style    # clock vs relative: a user-testing question
