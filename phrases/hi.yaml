# Terms with no settled everyday Hindi equivalent, where I have coined or
# borrowed something. A native speaker should confirm these before release.
review_needed:
  - tactile_paving   # "स्पर्श पट्टी" is a coinage
  - warning_column   # shares "खंभा" with pole - may need distinguishing
  - overhead_wire
  - pedestrian_signal
  - bearing_style    # clock vs relative: a user-testing question
