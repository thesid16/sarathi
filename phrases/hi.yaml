# Hindi phrasing table.
#
# DRAFT - needs review by a native speaker before it ships. Machine-translated
# object names are technically correct and unnatural to hear a hundred times a
# day, which is the difference between a tool people use and one they mute.
# Entries I am least confident about are marked in `review_needed` at the end.
#
# Deliberately not a translation of the English table:
#
# Direction style differs. English defaults to clock positions, the convention
# from orientation and mobility training. Hindi defaults to relative directions
# ("थोड़ा दाएँ") because clock-face bearings in Hindi come out as "एक बजे की
# दिशा में" - long, and natural only to someone already trained in the
# convention. Which is right is a question for user testing, not for me; both
# styles exist in both tables and it is one config key to switch.
#
# Word order differs. Hindi puts the direction first for urgent alerts:
# "सामने गड्ढा" (ahead, pothole) reads more naturally than the reverse.
#
# "डेढ़" is used for one-and-a-half. It is one word where English needs four,
# which matters when the point is to be brief.

lang: hi

bearing_style: relative
hedge_above_uncertainty: 0.25

templates:
  urgent: "{bearing} {object}"
  full: "{object}, {bearing}, {distance}"
  no_distance: "{object}, {bearing}"
  ahead_full: "सामने {object}, {distance}"
  ahead_no_distance: "सामने {object}"

bearing:
  ahead: "सामने"
  clock:
    10: "दस बजे"
    11: "ग्यारह बजे"
    12: "सामने"
    1: "एक बजे"
    2: "दो बजे"
    3: "तीन बजे"
  relative:
    ahead: "सामने"
    slight_left: "थोड़ा बाएँ"
    left: "बाईं ओर"
    slight_right: "थोड़ा दाएँ"
    right: "दाईं ओर"

distance:
  hedge: "लगभग"
  # फुट में, क्योंकि छोटी दूरी के लिए रोज़मर्रा की भाषा यही है।
  # `max` मीटर में ही रहता है - गणना उसी में होती है।
  unit: feet
  steps:
    - {max: 0.6, text: "डेढ़ फुट"}
    - {max: 0.9, text: "ढाई फुट"}
    - {max: 1.2, text: "साढ़े तीन फुट"}
    - {max: 1.7, text: "पाँच फुट"}
    - {max: 2.3, text: "सात फुट"}
    - {max: 3.2, text: "दस फुट"}
    - {max: 4.2, text: "तेरह फुट"}
    - {max: 5.5, text: "सोलह फुट"}
    - {max: 99.0, text: "बीस फुट"}

