# English phrasing table.
#
# Shared with the Android app - phrasing is data, not code, so both sides say
# the same thing and a wording change is a file edit rather than a release.
#
# Three rules shaped this table:
#
# Short beats complete. "Step down ahead" reaches the user before "stairs
# descending, twelve o'clock, two point five metres" has finished its first
# word. Urgent phrasings drop everything that is not needed to act.
#
# Round hard. Spoken distance is useful at roughly half-metre granularity and
# false precision is worse than useless - "one point four seven metres" implies
# an accuracy the estimator does not have, and takes three times as long to say.
#
# Say the object first. It is the word the user is waiting for; direction and
# distance can arrive a beat later. "Chair, two o'clock" not "at two o'clock,
# a chair".

lang: en

# Clock positions are the convention taught in orientation and mobility
# training. `relative` ("slightly left") is available for users who have not
# had that training - see the Hindi table, which defaults to it.
bearing_style: clock

# Hedge the distance when the estimator says it is unsure.
hedge_above_uncertainty: 0.25

templates:
  urgent: "{object} {bearing}"
  full: "{object}, {bearing}, {distance}"
  no_distance: "{object}, {bearing}"
  ahead_full: "{object} ahead, {distance}"
  ahead_no_distance: "{object} ahead"

bearing:
  ahead: "ahead"
  clock:
    10: "ten o'clock"
    11: "eleven o'clock"
    12: "ahead"
    1: "one o'clock"
    2: "two o'clock"
    3: "three o'clock"
  relative:
    ahead: "ahead"
    slight_left: "slightly left"
    left: "on your left"
    slight_right: "slightly right"
    right: "on your right"

distance:
  hedge: "about"
  steps:
    - {max: 0.75, text: "half a metre"}
    - {max: 1.25, text: "one metre"}
    - {max: 1.75, text: "one and a half metres"}
    - {max: 2.5, text: "two metres"}
    - {max: 3.5, text: "three metres"}
    - {max: 4.5, text: "four metres"}
    - {max: 5.5, text: "five metres"}
    - {max: 99.0, text: "six metres"}

# Spoken names. Only overrides - anything absent falls back to the taxonomy
# label with underscores replaced by spaces.
#
# These differ from the class names on purpose. "stairs_down" is a label; "step
# down" is what a person needs to hear, and it is two syllables shorter.
objects:
  stairs_down: "step down"
  stairs_up: "steps up"
  step_down: "step down"
  step_up: "step up"
  open_manhole: "open manhole"
  manhole_cover: "manhole"
  drain_grate: "drain"
  tactile_paving: "tactile path"
  traffic_light_red: "red light"
  traffic_light_green: "green light"
  pedestrian_signal: "crossing signal"
  crosswalk: "crossing"
  sign_board: "sign"
  sign_post: "signpost"
  warning_column: "post"
  traffic_cone: "cone"
  parked_bicycle: "parked bicycle"
  parked_scooter: "parked scooter"
  auto_rickshaw: "auto"
  cycle_rickshaw: "rickshaw"
  wheelchair_user: "wheelchair"
  overhead_wire: "low wire"
  glass_door: "glass door"
  door_handle: "handle"
  light_switch: "switch"
  fire_hydrant: "hydrant"
  medicine_strip: "medicine"

# Fixed phrases used outside the object-announcement path.
system:
  starting: "Sarathi ready"
  stopping: "Stopping"
  camera_lost: "Camera disconnected"
  camera_back: "Camera back"
  nothing_ahead: "Nothing ahead"
  reading: "Reading"
  no_text: "No text found"
  describing: "Looking"
  no_description: "Cannot describe that"
  vlm_missing: "Scene description is not installed"
  # Sent to the model, not spoken. Kept beside the spoken phrases because it is
  # the same translation job: the answer comes back in the language it is asked
  # in, so this is what makes a Hindi user get a Hindi description.
  describe_prompt: "What is in front of me right now?"
