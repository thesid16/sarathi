# Depth Anything V2 Base - EXCLUDED, deliberately.
#
# This manifest exists so the rule is enforced by code and visible in review,
# rather than living in a document nobody rereads.
#
# The trap: "Depth Anything V2 is Apache-2.0" is true of the Small checkpoint
# and false of Base and Large, which are CC-BY-NC-4.0. Same repository, same
# paper, same download page, different terms. It is an easy mistake to make and
# a painful one to discover after a model has been fine-tuned, quantized and
# written into a results table.
#
# Sarathi is AGPL-3.0 and public. A non-commercial component would mean a
# downstream accessibility startup could not ship what they build on this -
# which defeats the purpose of releasing it. The registry refuses to load
# anything marked `excluded`; see tests/test_models.py.

id: depth-anything-v2-base
task: depth
family: depth-anything-v2
version: 2.0.0

license: CC-BY-NC-4.0
distribution: excluded
source_url: https://github.com/DepthAnything/Depth-Anything-V2

runtime:
  prototype: onnxruntime

files:
  onnx:
    path: depth_anything_v2_base.onnx

notes: >
  Use depth-anything-v2-small (Apache-2.0) or midas-v21-small (MIT) instead.
  Keep this manifest: it documents a real licensing trap, and the test suite
  asserts that loading it fails.
