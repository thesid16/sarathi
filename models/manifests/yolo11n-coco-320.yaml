# Ultralytics YOLO11n at 320px.
#
# AGPL-3.0, which is the same licence as Sarathi, so there is no conflict.
# Under a closed commercial licence this model would be unusable without buying
# a commercial licence from Ultralytics - see docs/02-model-selection.md.
#
# Likely lead candidate: best tooling and export path of anything on the
# shortlist. It is benchmarked against Apache-2.0 alternatives, and if one of
# those lands within ~2 mAP that one ships instead, because a permissive model
# is worth more to the people who will reuse this project.

id: yolo11n-coco-320
task: detection
family: yolo11
version: 1.0.0

license: AGPL-3.0
distribution: bundled
source_url: https://github.com/ultralytics/ultralytics
attribution: "YOLO11 by Ultralytics, AGPL-3.0"

runtime:
  prototype: onnxruntime
  android: litert

files:
  onnx:
    path: yolo11n-320.onnx
    sha256: 2f383662ba435b9c9a2531fd4157b62aa56b12da7e99ee1bae3c8aebab3a044d
    size_bytes: 10575771
    url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt
  tflite:
    path: yolo11n-320-dynrange.tflite
    sha256: dda35cb6c584fb507a95b30025e06ee697a1c53c671056fb46a60e597ec27ae6
    size_bytes: 2866464
    url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt

# onnx2tf rewrites NCHW to NHWC, because that is the layout TFLite kernels
# want. Everything else about the input is identical, so only the layout is
# overridden rather than duplicating the whole block and letting the two drift.
input_overrides:
  tflite:
    layout: NHWC
    # Dynamic-range quantized: int8 weights, float32 activations computed at
    # runtime. Float I/O, so this is a drop-in for the fp32 build.
    #
    # It won a measured comparison of every variant onnx2tf can produce, and
    # the winner was not the obvious one:
    #
    #   fp32 baseline          10.60 MB   7.0 ms   class score 0.876
    #   dynamic-range           2.87 MB   5.7 ms   class score 0.878  <- shipped
    #   float16                 5.36 MB   6.3 ms   class score 0.876
    #   full INT8               2.95 MB   3.7 ms   class score 0.000  <- broken
    #   INT8 + int16 acts       3.07 MB   307 ms   class score 0.879  <- unusable
    #
    # Full INT8 is the fastest and detects nothing: box regression survives
    # while the classification head collapses, because post-sigmoid class
    # scores occupy a tiny range that per-tensor int8 scales round to zero.
    # The textbook fix - int16 activations - restores accuracy and is 46x
    # slower, because there is no optimised int16 kernel and it falls back to
    # reference implementations.
    #
    # fp16 is also unusable on the CPU path: onnx2tf's fp16 export makes the
    # whole graph fp16 including the input tensor, and TFLite's CPU CONV_2D
    # prepares only for float32/uint8/int8/int16. Verified on a Pixel 8a -
    # "Node number 1 (CONV_2D) failed to prepare". fp16 needs the GPU delegate.
    dtype: float32

input:
  width: 320
  height: 320
  layout: NCHW
  color: RGB
  dtype: float32
  resize: letterbox      # aspect-preserving; stretching moves every box
  pad_value: 114
  scale: 0.00392156862745098   # 1/255
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

output:
  decoder: yolo11        # anchor-free, [1, 4+nc, anchors], xywh centre form
  labels: coco80
  conf_threshold: 0.35
  nms_iou: 0.5
  max_detections: 50

delegates: [gpu, xnnpack]

notes: >
  Exported with ultralytics 8.4.117: YOLO("yolo11n.pt").export(format="onnx",
  imgsz=320, opset=13, dynamic=False). Graph input verified as [1,3,320,320],
  output [1,84,2100]. The url field points at the source .pt, not the onnx -
  the onnx is a build artefact, reproducible from that checkpoint by the
  command above.
