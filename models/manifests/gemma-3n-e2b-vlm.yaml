# Gemma 3n E2B for on-demand scene description.
#
# distribution: user_download, and that is a licensing decision rather than a
# size one.
#
# The Gemma Terms of Use permit commercial use but attach a use-restriction
# policy that must be passed downstream. AGPL-3.0 cannot absorb additional
# restrictions, so bundling these weights inside an AGPL project would muddy
# Sarathi's own licence. Fetched by the user instead, the terms sit between the
# user and Google, and Sarathi stays cleanly AGPL.
#
# The size argument points the same way: this is a multi-gigabyte download, and
# much of the target audience is on 4 GB phones where it will not run at all.
# It is viable on the Pixel 8a's 8 GB - which makes it a good development
# target and a bad default.

id: gemma-3n-e2b-vlm
task: vlm
family: gemma-3n
version: 1.0.0

license: Gemma-Terms-of-Use
distribution: user_download
source_url: https://ai.google.dev/gemma/terms
attribution: "Gemma 3n by Google DeepMind, Gemma Terms of Use"

runtime:
  android: litert

files:
  litertlm:
    path: gemma-3n-E2B-it.litertlm

requirements:
  min_ram_gb: 6

notes: >
  Optional model pack. The scene-description slot is defined by the
  SceneDescriber interface, so this drops in beside SmolVLM without any code
  change - which is exactly what the manifest system exists for.
  Not yet benchmarked; no claims made about its latency here.
