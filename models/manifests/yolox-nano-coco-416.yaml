# YOLOX-Nano, Apache-2.0.
#
# The preferred outcome. Apache-2.0 means anyone reusing Sarathi - an NGO, a
# student, another accessibility project - inherits no copyleft obligation from
# the detector. If this benchmarks within ~2 mAP of YOLO11n it ships instead.
#
# Note the unusual preprocessing: YOLOX does NOT scale to 0-1 and expects BGR.
# Feeding it a normalised RGB tensor produces a model that runs fine and detects
# almost nothing - exactly the class of silent failure the manifest exists to
# prevent.

id: yolox-nano-coco-416
task: detection
family: yolox
version: 1.0.0

license: Apache-2.0
distribution: bundled
source_url: https://github.com/Megvii-BaseDetection/YOLOX
attribution: "YOLOX by Megvii Inc., Apache-2.0"

runtime:
  prototype: onnxruntime
  android: litert

files:
  onnx:
    path: yolox_nano_416.onnx

input:
  width: 416
  height: 416
  layout: NCHW
  color: BGR             # not RGB
  dtype: float32
  resize: letterbox
  pad_value: 114
  scale: 1.0             # raw 0-255, no normalisation
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

output:
  decoder: yolox
  labels: coco80
  conf_threshold: 0.35
  nms_iou: 0.5
  max_detections: 50
  strides: [8, 16, 32]   # decoder-specific; preserved in OutputSpec.extra

delegates: [gpu, xnnpack]

notes: >
  416 is YOLOX-Nano's native training resolution. A 320 variant is worth
  benchmarking for latency, but requires re-export rather than just changing
  this number.
