# Depth Anything V2 Small - Apache-2.0, and the usable member of the family.
#
# Compare depth-anything-v2-base.yaml: same repository, same paper, different
# licence. Only the Small checkpoint is Apache-2.0.
#
# Runs on Tier 2 at ~2 Hz and only while the user is moving, because its job is
# not to measure distance - the geometric estimator does that far more cheaply -
# but to find hazards that have no bounding box: steps, kerbs, drop-offs, and
# surfaces no detector has a class for.
#
# Output is RELATIVE depth. It is not metres, and treating it as metres would
# produce confidently wrong spoken distances.

id: depth-anything-v2-small
task: depth
family: depth-anything-v2
version: 2.0.0

license: Apache-2.0
distribution: bundled
source_url: https://github.com/DepthAnything/Depth-Anything-V2
attribution: "Depth Anything V2 (Small), Apache-2.0"

runtime:
  prototype: onnxruntime
  android: litert

files:
  onnx:
    path: depth-anything-v2-small-252.onnx
    sha256: 36cf5d240f636073bb4c306ad50ac56389a31221d380ad31a64fb659c971cf5b
    size_bytes: 99102356
    url: https://huggingface.co/depth-anything/Depth-Anything-V2-Small-hf

input:
  width: 252
  height: 252
  layout: NCHW
  color: RGB
  dtype: float32
  resize: stretch          # depth models are trained on resized, not letterboxed, input
  scale: 0.00392156862745098   # 1/255
  mean: [0.485, 0.456, 0.406]  # ImageNet
  std: [0.229, 0.224, 0.225]

delegates: [gpu, xnnpack]

notes: >
  Exported at 252x252 rather than the native 518. DINOv2 uses patch 14, so the
  input must be a multiple of 14; 252 = 14*18. Step and kerb detection needs far
  less spatial precision than depth reconstruction does, and 518 is not
  affordable at any useful rate on a phone.

  Measured: 24.8M params, 99 MB FP32, 65 ms p50 on an M3 CPU at 252x252. That
  cost is the whole reason depth is a 2 Hz tier rather than a per-frame stage.
  INT8 should take the size to roughly a quarter; that is not yet measured.

  Output is INVERSE relative depth - larger values are NEARER, and the scale is
  arbitrary per frame. It is not metres and must never be used as metres.
